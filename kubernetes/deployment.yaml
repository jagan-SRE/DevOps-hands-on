apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-practice
  namespace: devops-practice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
      - name: devops-container
        image: ghcr.io/jagan-sre/devops-45day-practice:latest
        imagePullPolicy: Always
        env:
        - name: APP_VERSION
          value: "kubernetes"
        ports:
        - name: http
          containerPort: 5000
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
