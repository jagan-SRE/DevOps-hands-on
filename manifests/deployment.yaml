apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-nginx
  namespace: dev-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debug-nginx
  template:
    metadata:
      labels:
        app: debug-nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80