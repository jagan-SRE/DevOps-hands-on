apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-platform
  namespace: dev-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-platform
  template:
    metadata:
      labels:
        app: devops-platform
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80