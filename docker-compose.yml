services:
  app:
    build: .
    environment:
      APP_MESSAGE: ${APP_MESSAGE:-Cloud Native DevOps Platform Running!}
      APP_VERSION: ${APP_VERSION:-local-compose}
    ports:
    - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
    - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
    - "9090:9090"
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
    - ./monitoring/grafana.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
    - ./monitoring/dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
    - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - "3000:3000"
    depends_on:
    - prometheus
