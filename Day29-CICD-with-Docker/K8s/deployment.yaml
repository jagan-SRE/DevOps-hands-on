apiVersion: apps/v1
kind: Deployment
metadata:
  name: day29-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: day29
  template:
    metadata:
      labels:
        app: day29
    spec:
      containers:
      - name: day29-container
        image: jaganpudari/day29-cicd:latest
        ports:
        - containerPort: 80