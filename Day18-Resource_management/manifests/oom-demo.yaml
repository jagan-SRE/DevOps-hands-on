apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
  namespace: dev-platform
spec:
  containers:
  - name: stress
    image: polinux/stress
    args:
      - "--vm"
      - "1"
      - "--vm-bytes"
      - "300M"
      - "--vm-hang"
      - "1"
    resources:
      limits:
        memory: "200Mi"
      requests:
        memory: "100Mi"